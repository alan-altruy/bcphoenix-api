name: 'Setup and Build Maven'
description: 'Configure Java, cache Maven et exécute Maven'
inputs:
  java-version:
    description: 'Version de Java'
    required: false
    default: '21'
  maven-goal:
    description: 'Objectif Maven a executer (ex: verify, clean test)'
    required: false
    default: 'verify'

runs:
  using: 'composite'
  steps:
    - name: Set up Java
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven

    - name: Build and run tests
      shell: bash
      run: mvn -B ${{ inputs.maven-goal }} --file pom.xml
