name: 'Setup and Build Docker'
description: 'Lance le build et les tests via Docker Compose'
inputs:
  maven-goal:
    description: 'Objectif Maven ou commande à exécuter'
    required: false
    default: 'verify'

runs:
  using: 'composite'
  steps:
    - name: Build and run tests via Docker
      shell: bash
      run: |
        # On s'assure de lancer la phase Maven demandée dans le conteneur de test dédié
        docker compose -f docker-compose-unit-test.yaml run --rm test-runner ./mvnw clean ${{ inputs.maven-goal }}
