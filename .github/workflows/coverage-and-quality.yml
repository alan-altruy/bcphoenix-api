
name: Code Quality & Coverage

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: read

jobs:
  coverage-quality:
    name: Build, Tests & Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    env:
      MAX_PMD_VIOLATIONS: 5
      EXPECTED_PMD_VIOLATIONS: 0
      EXPECTED_COVERAGE: 0.90
      MIN_COVERAGE: 0.85

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: bcphoenix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      - name: Initialize database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -prootpassword bcphoenix < doc/schema.sql
      
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DATABASE_URL: jdbc:mysql://127.0.0.1:3306/bcphoenix
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=PokaChoc_bcphoenix-api -Dsonar.organization=pokachoc

      - name: Generate JaCoCo badges
        id: jacoco
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8
        with:
          generate-coverage-badge: true
          generate-branches-badge: true
          generate-summary: true
          badges-directory: badges-tmp

      # Récupération des rapports PMD déjà générés par verify
      
      - name: Analyze PMD violations
        id: pmd
        if: always()
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import os

          report = "target/pmd.xml"
          violations = []

          if os.path.isfile(report):
              tree = ET.parse(report)
              root = tree.getroot()

              # Gestion du namespace PMD
              ns = {"pmd": "http://pmd.sourceforge.net/report/2.0.0"}

              for file in root.findall("pmd:file", ns):
                  filename = file.get("name", "Unknown")

                  for violation in file.findall("pmd:violation", ns):
                      violations.append({
                          "file": filename,
                          "line": violation.get("beginline", "?"),
                          "rule": violation.get("rule", "Unknown"),
                          "priority": violation.get("priority", "?"),
                          "message": "".join(violation.itertext()).strip()
                      })

          total = len(violations)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"total={total}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("# PMD Code Quality Report\n\n")
              summary.write(f"**Total violations: {total}**\n\n")

              if total == 0:
                  summary.write("No PMD violations found. ✅\n")
              else:
                  summary.write("| File | Line | Rule | Priority | Description |\n")
                  summary.write("|---|---:|---|---:|---|\n")

                  for v in violations:
                      file = v["file"].replace("|", "\\|")
                      rule = v["rule"].replace("|", "\\|")
                      message = v["message"].replace("|", "\\|").replace("\n", " ")

                      summary.write(
                          f"| `{file}` | {v['line']} | {rule} "
                          f"| {v['priority']} | {message} |\n"
                      )

          print(f"PMD: {total} violations detected.")
          PY


      # Publication des rapports HTML et XML
      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pmd-report
          path: |
            target/site/pmd.html
            target/pmd.xml
          if-no-files-found: warn
          retention-days: 14
      

      - name: Deploy Badges to dedicated branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: ./badges-tmp
          commit_message: "chore: update coverage badges"

      - name: Comment Test Coverage & PMD Summary on PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          NEWLINE=$'\n'

          COVERAGE=$(awk "BEGIN {printf \"%.2f\", ${{ steps.jacoco.outputs.coverage }} * 100}")
          BRANCHES=$(awk "BEGIN {printf \"%.2f\", ${{ steps.jacoco.outputs.branches }} * 100}")

          PMD_TOTAL=${{ steps.pmd.outputs.total || 0 }}

          PMD_PERCENT=$(awk "BEGIN {printf \"%.2f\", $PMD_TOTAL * 100 / ${{ env.MAX_PMD_VIOLATIONS }}}")

          COVERAGE_EMOJI="✅"
          if (( $(echo "$COVERAGE < ${{ env.EXPECTED_COVERAGE }} * 100" | bc -l) )); then
            COVERAGE_EMOJI="⚠️"
          fi
          if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }} * 100" | bc -l) )); then
            COVERAGE_EMOJI="❌"
          fi

          BRANCHES_EMOJI="✅"
          if (( $(echo "$BRANCHES < ${{ env.EXPECTED_COVERAGE }} * 100" | bc -l) )); then
            BRANCHES_EMOJI="⚠️"
          fi
          if (( $(echo "$BRANCHES < ${{ env.MIN_COVERAGE }} * 100" | bc -l) )); then
            BRANCHES_EMOJI="❌"
          fi

          PMD_EMOJI="✅"
          if (( $(echo "$PMD_TOTAL > ${{ env.EXPECTED_PMD_VIOLATIONS }}" | bc -l) )); then
            PMD_EMOJI="⚠️"
          fi
          if (( $(echo "$PMD_TOTAL > ${{ env.MAX_PMD_VIOLATIONS }}" | bc -l) )); then
            PMD_EMOJI="❌"
          fi

          BODY="## Test Coverage & PMD Summary${NEWLINE}"
          BODY+="* __Test Coverage:__ ${COVERAGE}% ${COVERAGE_EMOJI}${NEWLINE}"
          BODY+="* __Branch Coverage:__ ${BRANCHES}% ${BRANCHES_EMOJI}${NEWLINE}"
          BODY+="* __PMD violations:__ ${PMD_PERCENT}% (${PMD_TOTAL} violations) ${PMD_EMOJI}${NEWLINE}"

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY+="${NEWLINE}### PMD Reports${NEWLINE}"
          BODY+="* [Download HTML/XML reports](${RUN_URL})${NEWLINE}"
          BODY+="* [View detailed PMD summary](${RUN_URL})${NEWLINE}"

          gh pr comment ${{ github.event.pull_request.number }} -b "$BODY"
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail build on low coverage
        run: |
          if (( $(echo "${{ steps.jacoco.outputs.coverage }} < ${{ env.MIN_COVERAGE }} || ${{ steps.jacoco.outputs.branches }} < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
            echo "⚠️ Code coverage is below minimum threshold (${{ env.MIN_COVERAGE }})"
            exit 1
          fi
