name: Jacoco/PMD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  coverage-quality:
    name: Run Coverage & PMD Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    env:
      MAX_PMD_VIOLATIONS: 5
      EXPECTED_PMD_VIOLATIONS: 0
      EXPECTED_COVERAGE: 0.90
      MIN_COVERAGE: 0.85

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and Build via Docker
        uses: ./.github/actions/setup-build
        with:
          maven-goal: 'verify'

      - name: Generate JaCoCo badges
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-coverage-badge: true
          generate-branches-badge: true
          generate-summary: true
          badges-directory: badges-tmp

      - name: Deploy Badges to dedicated branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: ./badges-tmp
          commit_message: "chore: update coverage badges"

      - name: Convert PMD XML to SARIF (Native Python)
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          import json
          import os

          xml_path = "target/pmd.xml"
          sarif_path = "target/pmd.sarif"

          if not os.path.exists(xml_path):
              print("No pmd.xml found, skipping conversion.")
              exit(0)

          tree = ET.parse(xml_path)
          root = tree.getroot()

          results = []
          for file_elem in root.findall(".//{*}file"):
              filename = file_elem.attrib.get("name", "")
              for violation in file_elem.findall("{*}violation"):
                  rule = violation.attrib.get("rule", "UnknownRule")
                  beginline = int(violation.attrib.get("beginline", 1))
                  endline = int(violation.attrib.get("endline", beginline))
                  message = violation.text.strip() if violation.text else ""

                  results.append({
                      "ruleId": rule,
                      "message": {"text": message},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": filename},
                              "region": {
                                  "startLine": beginline,
                                  "endLine": endline
                              }
                          }
                      }]
                  })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {"driver": {"name": "PMD"}},
                  "results": results
              }]
          }

          with open(sarif_path, "w") as f:
              json.dump(sarif, f, indent=2)
          print(f"Successfully converted {len(results)} PMD violations to SARIF.")
          '

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/pmd.sarif

      - name: Comment Test Coverage & PMD Summary on PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          NEWLINE=$'\n'

          COVERAGE=$(awk "BEGIN {printf \"%.2f\", ${{ steps.jacoco.outputs.coverage }} * 100}")
          BRANCHES=$(awk "BEGIN {printf \"%.2f\", ${{ steps.jacoco.outputs.branches }} * 100}")
          
          PMD_TOTAL=0
          if [ -f "target/pmd.xml" ]; then
            PMD_TOTAL=$(grep -c "<violation" target/pmd.xml || echo 0)
          fi
          
          PMD_PERCENT=$(awk "BEGIN {printf \"%.2f\", $PMD_TOTAL * 100 / ${{ env.MAX_PMD_VIOLATIONS }}}")

          COVERAGE_EMOJI="✅"
          if (( $(echo "$COVERAGE < ${{ env.EXPECTED_COVERAGE }} * 100" | bc -l) )); then
            COVERAGE_EMOJI="⚠️"
          fi
          if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }} * 100" | bc -l) )); then
            COVERAGE_EMOJI="❌"
          fi

          BRANCHES_EMOJI="✅"
          if (( $(echo "$BRANCHES < ${{ env.EXPECTED_COVERAGE }} * 100" | bc -l) )); then
            BRANCHES_EMOJI="⚠️"
          fi
          if (( $(echo "$BRANCHES < ${{ env.MIN_COVERAGE }} * 100" | bc -l) )); then
            BRANCHES_EMOJI="❌"
          fi

          PMD_EMOJI="✅"
          if (( $(echo "$PMD_TOTAL > ${{ env.EXPECTED_PMD_VIOLATIONS }}" | bc -l) )); then
            PMD_EMOJI="⚠️"
          fi
          if (( $(echo "$PMD_TOTAL > ${{ env.MAX_PMD_VIOLATIONS }}" | bc -l) )); then
            PMD_EMOJI="❌"
          fi

          BODY="## Test Coverage & PMD Summary${NEWLINE}"
          BODY+="* __Test Coverage:__ ${COVERAGE}% ${COVERAGE_EMOJI}${NEWLINE}"
          BODY+="* __Branch Coverage:__ ${BRANCHES}% ${BRANCHES_EMOJI}${NEWLINE}"
          BODY+="* __PMD violations:__ ${PMD_PERCENT}% (${PMD_TOTAL} violations) ${PMD_EMOJI}${NEWLINE}"

          if (( PMD_TOTAL > 0 )); then
            BODY+="* See [Security → Code scanning alerts](https://github.com/${{ github.repository }}/security/code-scanning) for details."
          fi

          gh pr comment ${{ github.event.pull_request.number }} -b "${BODY}"
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail build on low coverage
        run: |
          if (( $(echo "${{ steps.jacoco.outputs.coverage }} < ${{ env.MIN_COVERAGE }} or ${{ steps.jacoco.outputs.branches }} < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
            echo "⚠️ Code coverage is below minimum threshold (${{ env.MIN_COVERAGE }}%)"
            exit 1
          fi
