
name: Code Quality & Coverage

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  coverage-quality:
    name: Build, Tests & Code Quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      MAX_PMD_VIOLATIONS: 5
      EXPECTED_PMD_VIOLATIONS: 0
      EXPECTED_COVERAGE: 0.90
      MIN_COVERAGE: 0.85

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: bcphoenix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # --------------------------------------------------
      # SETUP
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Initialize database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -prootpassword bcphoenix < doc/schema.sql

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: zulu

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # --------------------------------------------------
      # BUILD & SONARCLOUD
      # --------------------------------------------------

      - name: Build, test and analyze
        id: build
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DATABASE_URL: jdbc:mysql://127.0.0.1:3306/bcphoenix
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
        run: |
          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=PokaChoc_bcphoenix-api \
            -Dsonar.organization=pokachoc

      # --------------------------------------------------
      # PMD ANALYSIS
      # --------------------------------------------------

      - name: Analyze PMD violations
        id: pmd
        if: always()
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import os

          report = "target/pmd.xml"
          violations = []

          if os.path.isfile(report):
              tree = ET.parse(report)
              root = tree.getroot()

              for file_node in root.iter():
                  if file_node.tag.split("}")[-1] != "file":
                      continue

                  filename = file_node.get("name", "Unknown")

                  for violation in file_node:
                      if violation.tag.split("}")[-1] != "violation":
                          continue

                      violations.append({
                          "file": filename,
                          "line": violation.get("beginline", "?"),
                          "rule": violation.get("rule", "Unknown"),
                          "priority": violation.get("priority", "?"),
                          "message": "".join(violation.itertext()).strip()
                      })

          total = len(violations)
          available = os.path.isfile(report)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"total={total}\n")
              output.write(f"available={str(available).lower()}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("# PMD Code Quality Report\n\n")
              summary.write(f"**Total violations: {total}**\n\n")

              if not available:
                  summary.write("⚠️ PMD report not available.\n")
              elif total == 0:
                  summary.write("No PMD violations found. ✅\n")
              else:
                  summary.write("| File | Line | Rule | Priority | Description |\n")
                  summary.write("|---|---:|---|---:|---|\n")

                  for v in violations:
                      file = v["file"].replace("|", "\\|")
                      rule = v["rule"].replace("|", "\\|")
                      message = v["message"].replace("|", "\\|").replace("\n", " ")

                      summary.write(
                          f"| `{file}` | {v['line']} | {rule} "
                          f"| {v['priority']} | {message} |\n"
                      )

          print(f"PMD: {total} violations detected.")
          PY

      # --------------------------------------------------
      # JACOCO ANALYSIS
      # --------------------------------------------------

      - name: Analyze Test Coverage
        id: jacoco
        if: always()
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import os

          report = "target/site/jacoco/jacoco.xml"

          coverage = 0.0
          branches = 0.0
          available = os.path.isfile(report)

          if available:
              tree = ET.parse(report)
              root = tree.getroot()

              for counter in root.findall("counter"):
                  covered = int(counter.get("covered", 0))
                  missed = int(counter.get("missed", 0))
                  total = covered + missed

                  value = covered / total if total else 0.0

                  if counter.get("type") == "INSTRUCTION":
                      coverage = value

                  elif counter.get("type") == "BRANCH":
                      branches = value

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"coverage={coverage}\n")
              output.write(f"branches={branches}\n")
              output.write(f"coverage_percent={coverage * 100:.2f}\n")
              output.write(f"branches_percent={branches * 100:.2f}\n")
              output.write(f"available={str(available).lower()}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("# Test Coverage Report\n\n")

              if not available:
                  summary.write("⚠️ JaCoCo report not available.\n")
              else:
                  summary.write(f"**Instruction Coverage:** {coverage * 100:.2f}%\n\n")
                  summary.write(f"**Branch Coverage:** {branches * 100:.2f}%\n\n")

          print(f"Test Coverage: {coverage * 100:.2f}%")
          print(f"Branch Coverage: {branches * 100:.2f}%")
          PY

      # --------------------------------------------------
      # ARTIFACTS
      # --------------------------------------------------

      - name: Upload PMD and JaCoCo reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: code-quality-reports
          path: |
            target/site/pmd.html
            target/pmd.xml
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # PULL REQUEST COMMENT
      # --------------------------------------------------

      - name: Comment Test Coverage & PMD Summary on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COVERAGE: ${{ steps.jacoco.outputs.coverage_percent || '0.00' }}
          BRANCHES: ${{ steps.jacoco.outputs.branches_percent || '0.00' }}
          COVERAGE_AVAILABLE: ${{ steps.jacoco.outputs.available || 'false' }}
          PMD_TOTAL: ${{ steps.pmd.outputs.total || '0' }}
          PMD_AVAILABLE: ${{ steps.pmd.outputs.available || 'false' }}
          MIN_COVERAGE: ${{ env.MIN_COVERAGE }}
          EXPECTED_COVERAGE: ${{ env.EXPECTED_COVERAGE }}
          MAX_PMD_VIOLATIONS: ${{ env.MAX_PMD_VIOLATIONS }}
          EXPECTED_PMD_VIOLATIONS: ${{ env.EXPECTED_PMD_VIOLATIONS }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          python3 <<'PY'
          import os

          coverage = float(os.environ["COVERAGE"])
          branches = float(os.environ["BRANCHES"])
          pmd_total = int(os.environ["PMD_TOTAL"])

          min_coverage = float(os.environ["MIN_COVERAGE"]) * 100
          expected_coverage = float(os.environ["EXPECTED_COVERAGE"]) * 100

          max_pmd = int(os.environ["MAX_PMD_VIOLATIONS"])
          expected_pmd = int(os.environ["EXPECTED_PMD_VIOLATIONS"])

          def coverage_status(value, available):
              if not available:
                  return "⚠️"
              if value < min_coverage:
                  return "❌"
              if value < expected_coverage:
                  return "⚠️"
              return "✅"

          def pmd_status(total, available):
              if not available:
                  return "⚠️"
              if total > max_pmd:
                  return "❌"
              if total > expected_pmd:
                  return "⚠️"
              return "✅"

          coverage_emoji = coverage_status(
              coverage,
              os.environ["COVERAGE_AVAILABLE"] == "true"
          )

          branches_emoji = coverage_status(
              branches,
              os.environ["COVERAGE_AVAILABLE"] == "true"
          )

          pmd_emoji = pmd_status(
              pmd_total,
              os.environ["PMD_AVAILABLE"] == "true"
          )

          build_emoji = "✅" if os.environ["BUILD_RESULT"] == "success" else "❌"

          pmd_percent = min(100, pmd_total * 100 / max_pmd) if max_pmd > 0 else 0

          body = f"""## Test Coverage & PMD Summary

          - **Build:** {os.environ["BUILD_RESULT"]} {build_emoji}
          - **Instruction Coverage:** {coverage:.2f}% {coverage_emoji}
          - **Branch Coverage:** {branches:.2f}% {branches_emoji}
          - **PMD violations:** {pmd_percent:.2f}% ({pmd_total} violations) {pmd_emoji}

          ### Reports

          [View detailed reports and artifacts]({os.environ["RUN_URL"]})
          """

          with open(os.path.join(os.environ["RUNNER_TEMP"], "pr-comment.md"), "w") as file:
              file.write(body)

          print(body)
          PY

          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr-comment.md"
        continue-on-error: true

      # --------------------------------------------------
      # QUALITY GATES
      # --------------------------------------------------

      - name: Check quality gates
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          COVERAGE: ${{ steps.jacoco.outputs.coverage || '0' }}
          BRANCHES: ${{ steps.jacoco.outputs.branches || '0' }}
          COVERAGE_AVAILABLE: ${{ steps.jacoco.outputs.available || 'false' }}
          PMD_TOTAL: ${{ steps.pmd.outputs.total || '0' }}
          PMD_AVAILABLE: ${{ steps.pmd.outputs.available || 'false' }}
          MIN_COVERAGE: ${{ env.MIN_COVERAGE }}
          MAX_PMD_VIOLATIONS: ${{ env.MAX_PMD_VIOLATIONS }}
        run: |
          python3 <<'PY'
          import os
          import sys

          errors = []

          if os.environ["BUILD_RESULT"] != "success":
              errors.append("Maven build, tests or SonarCloud analysis failed.")

          if os.environ["COVERAGE_AVAILABLE"] != "true":
              errors.append("JaCoCo report is missing.")
          else:
              minimum = float(os.environ["MIN_COVERAGE"])
              coverage = float(os.environ["COVERAGE"])
              branches = float(os.environ["BRANCHES"])

              if coverage < minimum:
                  errors.append(
                      f"Instruction coverage ({coverage:.2%}) "
                      f"is below minimum ({minimum:.0%})."
                  )

              if branches < minimum:
                  errors.append(
                      f"Branch coverage ({branches:.2%}) "
                      f"is below minimum ({minimum:.0%})."
                  )

          if os.environ["PMD_AVAILABLE"] != "true":
              errors.append("PMD report is missing.")
          else:
              total = int(os.environ["PMD_TOTAL"])
              maximum = int(os.environ["MAX_PMD_VIOLATIONS"])

              if total > maximum:
                  errors.append(
                      f"PMD violations ({total}) exceed maximum ({maximum})."
                  )

          if errors:
              print("❌ Quality gates failed:\n")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("✅ All quality gates passed.")
          PY
