
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      MAX_PMD_VIOLATIONS: 5
      EXPECTED_PMD_VIOLATIONS: 0
      EXPECTED_COVERAGE: 0.90
      MIN_COVERAGE: 0.85

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: bcphoenix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # --------------------------------------------------
      # SETUP
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 21
          distribution: zulu

      # Cache SonarQube
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Cache Maven
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Initialize database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -prootpassword bcphoenix < doc/schema.sql

      # --------------------------------------------------
      # BUILD & SONARCLOUD
      # --------------------------------------------------

      - name: Build, test and analyze
        id: build
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DATABASE_URL: jdbc:mysql://127.0.0.1:3306/bcphoenix
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
          ADMIN_EMAIL: admin@sample.com
          ADMIN_PASSWORD: adminpassword
        run: |
          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=PokaChoc_bcphoenix-api \
            -Dsonar.organization=pokachoc

      # --------------------------------------------------
      # PMD ANALYSIS
      # --------------------------------------------------

      - name: Analyze PMD violations
        id: pmd
        if: always()
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import os

          report = "target/pmd.xml"
          violations = []

          if os.path.isfile(report):
              tree = ET.parse(report)
              root = tree.getroot()

              for file_node in root.iter():
                  if file_node.tag.split("}")[-1] != "file":
                      continue

                  filename = file_node.get("name", "Unknown")

                  for violation in file_node:
                      if violation.tag.split("}")[-1] != "violation":
                          continue

                      violations.append({
                          "file": filename,
                          "line": violation.get("beginline", "?"),
                          "rule": violation.get("rule", "Unknown"),
                          "priority": violation.get("priority", "?"),
                          "message": "".join(violation.itertext()).strip()
                      })

          total = len(violations)
          available = os.path.isfile(report)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"total={total}\n")
              output.write(f"available={str(available).lower()}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("# PMD Code Quality Report\n\n")
              summary.write(f"**Total violations: {total}**\n\n")

              if not available:
                  summary.write("⚠️ PMD report not available.\n")
              elif total == 0:
                  summary.write("No PMD violations found. ✅\n")
              else:
                  summary.write("| File | Line | Rule | Priority | Description |\n")
                  summary.write("|---|---:|---|---:|---|\n")

                  for v in violations:
                      file = v["file"].replace("|", "\\|")
                      rule = v["rule"].replace("|", "\\|")
                      message = v["message"].replace("|", "\\|").replace("\n", " ")

                      summary.write(
                          f"| `{file}` | {v['line']} | {rule} "
                          f"| {v['priority']} | {message} |\n"
                      )

          print(f"PMD: {total} violations detected.")
          PY

      # --------------------------------------------------
      # JACOCO ANALYSIS
      # --------------------------------------------------

      - name: Analyze Test Coverage
        id: jacoco
        if: always()
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import os

          report = "target/site/jacoco/jacoco.xml"

          coverage = 0.0
          branches = 0.0
          available = os.path.isfile(report)

          if available:
              tree = ET.parse(report)
              root = tree.getroot()

              for counter in root.findall("counter"):
                  covered = int(counter.get("covered", 0))
                  missed = int(counter.get("missed", 0))
                  total = covered + missed

                  value = covered / total if total else 0.0

                  if counter.get("type") == "INSTRUCTION":
                      coverage = value
                  elif counter.get("type") == "BRANCH":
                      branches = value

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"coverage={coverage}\n")
              output.write(f"branches={branches}\n")
              output.write(f"coverage_percent={coverage * 100:.2f}\n")
              output.write(f"branches_percent={branches * 100:.2f}\n")
              output.write(f"available={str(available).lower()}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("# Test Coverage Report\n\n")

              if not available:
                  summary.write("⚠️ JaCoCo report not available.\n")
              else:
                  summary.write(f"**Instruction Coverage:** {coverage * 100:.2f}%\n\n")
                  summary.write(f"**Branch Coverage:** {branches * 100:.2f}%\n\n")

          print(f"Test Coverage: {coverage * 100:.2f}%")
          print(f"Branch Coverage: {branches * 100:.2f}%")
          PY

      # --------------------------------------------------
      # EXPORT METRICS
      # --------------------------------------------------

      - name: Prepare quality results
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome || 'failure' }}
          COVERAGE: ${{ steps.jacoco.outputs.coverage || '0' }}
          BRANCHES: ${{ steps.jacoco.outputs.branches || '0' }}
          COVERAGE_PERCENT: ${{ steps.jacoco.outputs.coverage_percent || '0.00' }}
          BRANCHES_PERCENT: ${{ steps.jacoco.outputs.branches_percent || '0.00' }}
          COVERAGE_AVAILABLE: ${{ steps.jacoco.outputs.available || 'false' }}
          PMD_TOTAL: ${{ steps.pmd.outputs.total || '0' }}
          PMD_AVAILABLE: ${{ steps.pmd.outputs.available || 'false' }}
        run: |
          python3 <<'PY'
          import json
          import os

          results = {
              "build_result": os.environ["BUILD_RESULT"],
              "coverage": float(os.environ["COVERAGE"]),
              "branches": float(os.environ["BRANCHES"]),
              "coverage_percent": float(os.environ["COVERAGE_PERCENT"]),
              "branches_percent": float(os.environ["BRANCHES_PERCENT"]),
              "coverage_available": os.environ["COVERAGE_AVAILABLE"] == "true",
              "pmd_total": int(os.environ["PMD_TOTAL"]),
              "pmd_available": os.environ["PMD_AVAILABLE"] == "true"
          }

          with open("quality-results.json", "w") as file:
              json.dump(results, file, indent=2)
          PY

      # --------------------------------------------------
      # ARTIFACTS
      # --------------------------------------------------

      - name: Upload PMD, JaCoCo reports and metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: code-quality-reports
          path: |
            quality-results.json
            target/site/pmd.html
            target/pmd.xml
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------
  # QUALITY CHECKS (SEPARATE WORKFLOW)
  # --------------------------------------------------

  quality-check:
    needs: build
    if: always()
    uses: ./.github/workflows/quality-check.yml
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    with:
      build_result: ${{ needs.build.result }}
      min_coverage: 0.85
      expected_coverage: 0.90
      max_pmd_violations: 5
      expected_pmd_violations: 0
