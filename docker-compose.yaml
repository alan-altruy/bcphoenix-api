services:
  # --- Base de données MySQL ---
  mysql:
    image: mysql:8.0
    container_name: bcphoenix-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./doc/schema.sql:/docker-entrypoint-initdb.d/schema.sql # Décommente si tu veux initialiser les tables au premier run
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Java (API) ---
  api-service:
    image: eclipse-temurin:21-jdk
    container_name: bcphoenix-api-service
    working_dir: /app
    volumes:
      - .:/app # Monte tout ton projet dans le conteneur
      - maven_cache:/root/.m2/repository
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy # Attend que MySQL ait fini de démarrer
    # Exécute Maven en pointant sur le conteneur mysql-test pour les tests unitaires
    command: >
      ./mvnw spring-boot:run
    networks:
      - app-net

volumes:
  mysql_data:
  maven_cache:

networks:
  app-net:
    driver: bridge
